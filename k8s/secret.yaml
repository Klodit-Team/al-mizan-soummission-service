apiVersion: v1
kind: Secret
metadata:
  name: soumission-service-secrets
  namespace: al-mizan
  labels:
    app: soumission-service
type: Opaque
# ═══════════════════════════════════════════════════════════
# IMPORTANT : Les valeurs ci-dessous sont des placeholders.
# En production, utiliser :
#   - Sealed Secrets (Bitnami)
#   - External Secrets Operator (AWS/Azure/GCP)
#   - HashiCorp Vault
# Ne JAMAIS committer de vrais secrets dans Git.
# ═══════════════════════════════════════════════════════════
stringData:
  MYSQL_USER: "soumission_user"
  MYSQL_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  RABBITMQ_USER: "soumission_svc"
  RABBITMQ_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  MINIO_ACCESS_KEY: "CHANGE_ME_IN_PRODUCTION"
  MINIO_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  SSL_KEYSTORE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
