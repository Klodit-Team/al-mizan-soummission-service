apiVersion: apps/v1
kind: Deployment
metadata:
  name: soumission-service
  namespace: al-mizan
  labels:
    app: soumission-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soumission-service
  template:
    metadata:
      labels:
        app: soumission-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: soumission-service
      containers:
        - name: soumission-service
          image: registry.klodit.dz/al-mizan/soumission-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
              name: http
              protocol: TCP

          # ── Variables d'environnement ──────────
          envFrom:
            - configMapRef:
                name: soumission-service-config
            - secretRef:
                name: soumission-service-secrets

          # ── Ressources ────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          # ── Probes ────────────────────────────
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3

          # ── Volume mTLS (optionnel) ───────────
          volumeMounts:
            - name: mtls-certs
              mountPath: /app/certs
              readOnly: true

      volumes:
        - name: mtls-certs
          secret:
            secretName: soumission-service-mtls
            optional: true

      # ── Anti-affinité (répartition sur nœuds) ──
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - soumission-service
                topologyKey: kubernetes.io/hostname
