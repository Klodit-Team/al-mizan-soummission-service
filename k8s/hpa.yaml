# ═══════════════════════════════════════════════════════════
# HPA — Horizontal Pod Autoscaler
# Conformément au CSL § 4.7 : scalabilité horizontale, services stateless.
#
# Règles :
#   - Min 2 pods (haute disponibilité ≥ 99.5%)
#   - Max 10 pods
#   - Scale-up à 70% CPU
#   - Scale-up à 80% mémoire
#   - Cooldown scale-down : 300s (éviter le flapping)
# ═══════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soumission-service-hpa
  namespace: al-mizan
  labels:
    app: soumission-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soumission-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
