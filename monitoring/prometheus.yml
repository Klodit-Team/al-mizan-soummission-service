# ═══════════════════════════════════════════════════════════
#  Prometheus — Configuration de scraping
# ═══════════════════════════════════════════════════════════
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Soumission Service ──────────────────────────
  - job_name: "soumission-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:8004"]
        labels:
          service: "soumission-service"
          environment: "dev"
