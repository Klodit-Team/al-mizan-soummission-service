# ═══════════════════════════════════════════════════════════
#  PROFIL mTLS — soumission_service
#  Activé avec : --spring.profiles.active=prod,mtls
#
#  En prod Kubernetes, les certificats sont montés via
#  cert-manager et Kubernetes Secrets en volumes.
# ═══════════════════════════════════════════════════════════

# Serveur TLS
server.ssl.enabled=true
server.ssl.protocol=TLSv1.3
server.ssl.enabled-protocols=TLSv1.3

# Keystore (identité du service)
server.ssl.key-store=${SSL_KEYSTORE:classpath:certs/server-keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=soumission-service

# Truststore (CA de confiance pour vérifier les clients)
server.ssl.trust-store=${SSL_TRUSTSTORE:classpath:certs/truststore.p12}
server.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD:changeit}
server.ssl.trust-store-type=PKCS12

# mTLS — exiger un certificat client valide
server.ssl.client-auth=need
