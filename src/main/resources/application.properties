# ═══════════════════════════════════════════════════
# APPLICATION
# ═══════════════════════════════════════════════════
spring.application.name=soumission-service
server.port=8004

# ═══════════════════════════════════════════════════
# MYSQL (Database-per-Service : soumission_db)
# ═══════════════════════════════════════════════════
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/soumission_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ═══════════════════════════════════════════════════
# REDIS (Sessions + Cache)
# ═══════════════════════════════════════════════════
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms

# ═══════════════════════════════════════════════════
# RABBITMQ (Messagerie Asynchrone)
# ═══════════════════════════════════════════════════
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=/

# ═══════════════════════════════════════════════════
# MINIO (Stockage Fichiers S3)
# ═══════════════════════════════════════════════════
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.offres-techniques=offres-techniques
minio.bucket.offres-financieres=offres-financieres
minio.bucket.offres-financieres-claires=offres-financieres-claires
minio.bucket.cautions=cautions

# ═══════════════════════════════════════════════════
# SPRINGDOC / SWAGGER UI
# ═══════════════════════════════════════════════════
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ═══════════════════════════════════════════════════
# UPLOAD LIMITS
# ═══════════════════════════════════════════════════
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ═══════════════════════════════════════════════════
# CHIFFREMENT
# ═══════════════════════════════════════════════════
chiffrement.rsa.key-size=4096
chiffrement.aes.key-size=256
chiffrement.shamir.total-shares=${SHAMIR_TOTAL_SHARES:5}
chiffrement.shamir.threshold=${SHAMIR_THRESHOLD:3}

# ═══════════════════════════════════════════════════
# SERVICES EXTERNES (appels REST synchrones)
# ═══════════════════════════════════════════════════
services.appel-offre.url=${AO_SERVICE_URL:http://localhost:8003}
services.utilisateur.url=${USER_SERVICE_URL:http://localhost:3002}
services.document.url=${DOCUMENT_SERVICE_URL:http://localhost:8005}

# ═══════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════
logging.level.com.klodit.soumission_service=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ═══════════════════════════════════════════════════
# SÉCURITÉ — Filtre session
# ═══════════════════════════════════════════════════
# Désactiver en dev pour faciliter les tests sans API Gateway
security.filter.enabled=false
# Fallback dev : accepter X-User-Id/X-User-Role sans session Redis
# ATTENTION : JAMAIS true en production (usurpation d'identité possible)
security.dev-fallback.enabled=true

# ═══════════════════════════════════════════════════
# ACTUATOR & PROMETHEUS
# ═══════════════════════════════════════════════════
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Tags communs pour Prometheus/Grafana
management.metrics.tags.application=soumission-service
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:dev}

# ═══════════════════════════════════════════════════
# CORS (origines autorisées)
# ═══════════════════════════════════════════════════
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
