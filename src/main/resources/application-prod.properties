# ═══════════════════════════════════════════════════════════════
#  PROFIL PRODUCTION — soumission_service
#  Activé avec : --spring.profiles.active=prod
# ═══════════════════════════════════════════════════════════════

# ── Datasource (prod — serveur MySQL dédié) ───────────────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/soumission_db?useSSL=true&requireSSL=true&verifyServerCertificate=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Redis (prod) ─────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ── RabbitMQ (prod) ──────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.ssl.enabled=true

# ── MinIO / S3 (prod) ───────────────────────────────────────
minio.url=${MINIO_URL:https://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}

# ── Swagger DÉSACTIVÉ en production (sécurité) ──────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── TLS 1.3 / HTTPS ─────────────────────────────────────────
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.protocol=TLSv1.3
server.ssl.enabled-protocols=TLSv1.3

# ── Logging structuré (JSON — pour ELK/Loki) ────────────────
logging.level.root=WARN
logging.level.com.klodit.soumission_service=INFO
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n

# ── Services externes (prod) ────────────────────────────────
services.appel-offre.url=${AO_SERVICE_URL:http://appel-offre-service:8003}
services.utilisateur.url=${USER_SERVICE_URL:http://utilisateur-service:8002}

# ── Actuator (restreint en prod) ─────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=soumission-service
management.metrics.tags.environment=prod

# ── CORS prod — uniquement l'API Gateway ─────────────────────
cors.allowed-origins=${CORS_ORIGINS:https://api.almizan.dz}

# ── Chiffrement Shamir (prod) ────────────────────────────────
chiffrement.shamir.total-shares=${SHAMIR_TOTAL_SHARES:5}
chiffrement.shamir.threshold=${SHAMIR_THRESHOLD:3}
